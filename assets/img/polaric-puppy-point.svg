<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Polaric's puppy astronaut pointing at the rating stars">
  <!-- Polaric's puppy astronaut, drawn from the app icon. Floats, ears flop, blinks ^^, tongue wiggles,
       the star on the helmet wobbles, the orbit's light runs round, sparkles twinkle.
       Still under reduced motion. -->
  <style>
    .float { animation: float 5.6s ease-in-out infinite; }
    .head { animation: tilt 7s ease-in-out infinite; transform-origin: 330px 300px; }
    .ear-l { animation: flopL 3.2s ease-in-out infinite; transform-origin: 210px 196px; }
    .ear-r { animation: flopR 3.2s ease-in-out -1.6s infinite; transform-origin: 458px 196px; }
    .eyes { animation: blink 4.6s infinite; transform-origin: 345px 268px; }
    .tongue { animation: lick 1.4s ease-in-out infinite; transform-origin: 352px 330px; }
    .crown { animation: wobble 3s ease-in-out infinite; transform-origin: 336px 96px; }
    .bigstar { animation: bob 3.4s ease-in-out infinite; transform-origin: 452px 520px; }
    .lines { animation: pop 1.6s ease-in-out infinite; transform-origin: 150px 150px; }
    .shine { animation: run 4s linear infinite; }
    .tail { animation: wave 2.6s ease-in-out infinite; transform-origin: 230px 420px; }
    .tw1 { animation: tw 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tw2 { animation: tw 2.2s ease-in-out -1.1s infinite; transform-box: fill-box; transform-origin: center; }
    .point { animation: point 1.8s cubic-bezier(.45, 0, .55, 1) infinite; transform-origin: 296px 452px; }
    .cloud { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes tilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes flopL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
    @keyframes flopR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 92% { transform: scaleY(.15); } }
    @keyframes lick { 0%, 100% { transform: scaleY(.85) rotate(-4deg); } 50% { transform: scaleY(1.12) rotate(4deg); } }
    @keyframes wobble { 0%, 100% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(6deg) scale(1.06); } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-10px) rotate(6deg); } }
    @keyframes pop { 0%, 100% { transform: scale(.85); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }
    @keyframes run { to { stroke-dashoffset: -1400; } }
    @keyframes wave { 0%, 100% { transform: skewY(0deg) rotate(0deg); } 50% { transform: skewY(-6deg) rotate(4deg); } }
    @keyframes tw { 0%, 100% { transform: scale(.55); opacity: .5; } 50% { transform: scale(1.15); opacity: 1; } }
    @keyframes point { 0%, 100% { transform: rotate(0deg) translate(0, 0); } 50% { transform: rotate(-4deg) translate(-6px, 8px); } }
    @keyframes drift { from { transform: translateX(-8px); } to { transform: translateX(10px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="helmet" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#fbf8ff"/><stop offset=".55" stop-color="#e2d6ff"/><stop offset="1" stop-color="#a88cf0"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7b4ff"/></linearGradient>
    <radialGradient id="visor" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#3a2878"/><stop offset=".55" stop-color="#140c33"/><stop offset="1" stop-color="#07041a"/></radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c9ff"/><stop offset="1" stop-color="#9f80ee"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a0"/><stop offset=".5" stop-color="#ffd43b"/><stop offset="1" stop-color="#f5a312"/></linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b2fd6"/><stop offset=".6" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d3fe6"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".45" stop-color="#e9d5ff"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cdb8ff"/><stop offset=".45" stop-color="#9b7bf2"/><stop offset=".75" stop-color="#6d45dc" stop-opacity=".9"/><stop offset="1" stop-color="#5b33c9" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shade" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a0f6b" flood-opacity=".45"/></filter>
    <clipPath id="back"><rect x="0" y="0" width="640" height="330"/></clipPath>
    <clipPath id="front"><rect x="0" y="330" width="640" height="310"/></clipPath>
  </defs>

  <circle cx="330" cy="300" r="280" fill="url(#glow)"/>

  <!-- the orbit, back half -->
  <g transform="rotate(-16 330 330)">
    <ellipse cx="330" cy="330" rx="285" ry="92" fill="none" stroke="url(#ring)" stroke-width="11" opacity=".6" clip-path="url(#back)" filter="url(#soft)"/>
  </g>

  <g class="float">
    <!-- excitement lines -->
    <g class="lines" stroke="#ffd43b" stroke-width="11" stroke-linecap="round">
      <path d="M150 112 L132 88"/><path d="M128 150 L98 142"/><path d="M146 186 L118 196"/>
    </g>

    <!-- scarf tail behind -->
    <path class="tail" d="M236 412 C 190 404, 140 424, 92 452 C 140 462, 196 452, 248 436 Z" fill="url(#scarf)" filter="url(#shade)"/>

    <g class="head">
      <!-- floppy ears -->
      <g class="ear-l"><path d="M214 186 C 132 162, 62 246, 66 340 C 70 404, 138 426, 176 384 C 208 348, 236 258, 214 186 Z" fill="url(#ear)" filter="url(#shade)"/><path d="M196 218 C 140 214, 104 276, 110 336 C 114 368, 146 376, 164 352" fill="none" stroke="#8a6ae0" stroke-opacity=".45" stroke-width="8" stroke-linecap="round"/></g>
      <g class="ear-r"><path d="M454 186 C 536 162, 606 246, 602 340 C 598 404, 530 426, 492 384 C 460 348, 432 258, 454 186 Z" fill="url(#ear)" filter="url(#shade)"/><path d="M472 218 C 528 214, 564 276, 558 336 C 554 368, 522 376, 504 352" fill="none" stroke="#8a6ae0" stroke-opacity=".45" stroke-width="8" stroke-linecap="round"/></g>
      <!-- helmet -->
      <ellipse cx="334" cy="262" rx="178" ry="168" fill="url(#helmet)" filter="url(#shade)"/>
      <path d="M200 190 C 230 120, 300 96, 360 98" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/>
      <path d="M190 250 C 186 220, 194 196, 206 178" fill="none" stroke="#b39af2" stroke-width="5" stroke-linecap="round"/>
      <!-- visor -->
      <ellipse cx="344" cy="282" rx="142" ry="120" fill="url(#rim)"/>
      <ellipse cx="344" cy="284" rx="127" ry="106" fill="url(#visor)"/>
      <path d="M248 238 C 262 206, 296 188, 336 186" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="9" stroke-linecap="round"/>
      <!-- the puppy's face -->
      <g class="eyes" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none" filter="url(#soft)">
        <path d="M268 272 q26 -32 52 0"/><path d="M372 272 q26 -32 52 0"/>
      </g>
      <ellipse cx="262" cy="310" rx="20" ry="12" fill="#ff8fb8" opacity=".9"/>
      <ellipse cx="430" cy="310" rx="20" ry="12" fill="#ff8fb8" opacity=".9"/>
      <ellipse cx="346" cy="326" rx="54" ry="42" fill="#fbf7ff"/>
      <g class="tongue"><path d="M338 330 h28 v18 a14 14 0 0 1 -28 0 z" fill="#ff6f9c"/><path d="M352 334 v14" stroke="#d94b7c" stroke-width="3" stroke-linecap="round"/></g>
      <path d="M322 324 q14 14 30 0 q16 14 30 0" fill="none" stroke="#1a1030" stroke-width="5" stroke-linecap="round"/>
      <path d="M334 296 q12 -8 24 0 q-2 14 -12 16 q-10 -2 -12 -16 z" fill="#140c24"/>
      <ellipse cx="342" cy="299" rx="4" ry="2.5" fill="#fff" opacity=".8"/>
      <!-- gold star on the helmet -->
      <g class="crown"><path d="M336 42 l17 35 38 5 -28 26 7 38 -34 -18 -34 18 7 -38 -28 -26 38 -5z" fill="url(#gold)" stroke="#e89a0c" stroke-width="4" stroke-linejoin="round" filter="url(#shade)"/></g>
    </g>

    <!-- scarf round the neck, with a star brooch -->
    <path d="M206 398 C 260 372, 420 370, 476 396 C 480 424, 440 444, 344 446 C 254 446, 210 428, 206 398 Z" fill="url(#scarf)" filter="url(#shade)"/>
    <path d="M232 404 C 290 388, 400 386, 452 402" fill="none" stroke="#b79cff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- clouds it sits in -->
  <g class="cloud" filter="url(#shade)">
    <path d="M40 640 C 20 560, 90 520, 150 540 C 170 480, 260 470, 300 520 C 330 470, 430 470, 450 530 C 500 490, 600 510, 600 590 C 640 600, 640 640, 640 640 Z" fill="url(#cloud)"/>
    <path d="M150 548 C 176 506, 240 498, 276 530" fill="none" stroke="#e9ddff" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"/>
    <path d="M330 520 C 360 490, 420 494, 440 530" fill="none" stroke="#e9ddff" stroke-opacity=".6" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- right paw on the cloud's edge; the left arm reaches out and points at the rating stars -->
  <g class="float">
    <g filter="url(#shade)"><ellipse cx="398" cy="470" rx="46" ry="36" fill="#fbf7ff"/></g>
    <g stroke="#cbbdf2" stroke-width="4" stroke-linecap="round"><path d="M382 488 v-14"/><path d="M398 492 v-16"/><path d="M414 488 v-14"/></g>
    <g class="point">
      <g filter="url(#shade)">
        <path d="M296 452 C 268 470, 244 492, 228 512" fill="none" stroke="#fbf7ff" stroke-width="56" stroke-linecap="round"/>
        <ellipse cx="218" cy="522" rx="38" ry="31" fill="#fbf7ff" transform="rotate(-48 218 522)"/>
        <path d="M200 540 L 178 568" stroke="#fbf7ff" stroke-width="26" stroke-linecap="round"/>
      </g>
      <g stroke="#cbbdf2" stroke-width="4" stroke-linecap="round"><path d="M226 546 l8 -12"/><path d="M240 536 l8 -12"/></g>
    </g>
  </g>

  <!-- the orbit, front half, with light running round it -->
  <g transform="rotate(-16 330 330)">
    <ellipse cx="330" cy="330" rx="285" ry="92" fill="none" stroke="url(#ring)" stroke-width="11" clip-path="url(#front)" filter="url(#soft)"/>
    <ellipse class="shine" cx="330" cy="330" rx="285" ry="92" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="90 1310" stroke-linecap="round" clip-path="url(#front)"/>
  </g>

  <!-- the big star it holds -->
  <g class="bigstar"><path d="M452 432 l25 52 57 8 -41 39 10 56 -51 -27 -51 27 10 -56 -41 -39 57 -8z" fill="url(#gold)" stroke="#e89a0c" stroke-width="5" stroke-linejoin="round" filter="url(#shade)"/>
    <path d="M436 486 l10 -18" stroke="#fff8c8" stroke-width="7" stroke-linecap="round"/></g>

  <!-- sparkles -->
  <path class="tw1" d="M560 120 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z" fill="#ffd43b"/>
  <path class="tw2" d="M90 330 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" fill="#ffd43b"/>
  <path class="tw2" d="M590 380 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#fff"/>
  <path class="tw1" d="M480 40 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#e9ddff"/>
</svg>
