<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Polaric">
  <!-- Polaric's icon: the robot with its ring inside the glowing tile. Eyes blink, the ring's light
       travels round, the sparkles twinkle, the robot floats a little. Still under reduced motion. -->
  
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1784"/><stop offset=".55" stop-color="#1c0b4a"/><stop offset="1" stop-color="#0c0526"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9a8ff"/><stop offset=".5" stop-color="#8b5cff"/><stop offset="1" stop-color="#5b3df0"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3f0"/><stop offset=".5" stop-color="#c58bff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
    <radialGradient id="eye" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#bcd6ff"/><stop offset="1" stop-color="#7f8dff"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#9b6bff" stop-opacity=".55"/><stop offset="1" stop-color="#9b6bff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="5" y="5" width="90" height="90" rx="23"/></clipPath>
    <clipPath id="front"><path d="M0 55 L100 34 L100 100 L0 100z"/></clipPath>
  </defs>

  <rect x="5" y="5" width="90" height="90" rx="23" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <circle cx="50" cy="48" r="40" fill="url(#glow)"/>
    <g class="bot">
      <!-- ring, back half -->
      <ellipse cx="50" cy="55" rx="37" ry="11" transform="rotate(-12 50 55)" fill="none" stroke="url(#ring)" stroke-width="4.2" opacity=".55"/>
      <!-- body and arm -->
      <circle cx="50" cy="80" r="14" fill="#0b0720" stroke="#e6dcff" stroke-width="3" filter="url(#soft)"/>
      <path d="M38 72 L23 79" stroke="#e6dcff" stroke-width="2.6" stroke-linecap="round" filter="url(#soft)"/>
      <circle cx="21.5" cy="80" r="3.6" fill="#0b0720" stroke="#e6dcff" stroke-width="2.4"/>
      <!-- head -->
      <rect x="27" y="29" width="46" height="31" rx="15.5" fill="#07051a" stroke="#efe8ff" stroke-width="3.2" filter="url(#soft)"/>
      <path d="M33 37 q2-4 7-4.5" stroke="#ffffff" stroke-opacity=".35" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g class="eyes" filter="url(#soft)">
        <circle cx="41" cy="45" r="5.6" fill="url(#eye)"/>
        <circle cx="59" cy="45" r="5.6" fill="url(#eye)"/>
        <circle cx="42.6" cy="43.2" r="1.5" fill="#fff"/>
        <circle cx="60.6" cy="43.2" r="1.5" fill="#fff"/>
      </g>
      <ellipse cx="35.5" cy="52.5" rx="2.6" ry="1.5" fill="#ff7fc0" opacity=".8"/>
      <ellipse cx="64.5" cy="52.5" rx="2.6" ry="1.5" fill="#ff7fc0" opacity=".8"/>
      <path d="M47 52.5 q3 2.6 6 0" stroke="#ffffff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      <!-- ring, front half, with light running round it -->
      <g clip-path="url(#front)">
        <ellipse cx="50" cy="55" rx="37" ry="11" transform="rotate(-12 50 55)" fill="none" stroke="url(#ring)" stroke-width="4.2" filter="url(#soft)"/>
      </g>
      <ellipse class="run" cx="50" cy="55" rx="37" ry="11" transform="rotate(-12 50 55)" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.6" stroke-dasharray="14 186" stroke-linecap="round" clip-path="url(#front)"/>
    </g>
    <!-- sparkles -->
    <path class="tw1" d="M80 16 l1.6 4.6 4.6 1.6 -4.6 1.6 -1.6 4.6 -1.6-4.6 -4.6-1.6 4.6-1.6z" fill="#f4ecff"/>
    <path class="tw2" d="M70 13 l.9 2.6 2.6.9 -2.6.9 -.9 2.6 -.9-2.6 -2.6-.9 2.6-.9z" fill="#d9c8ff"/>
    <path class="tw2" d="M18 30 l.8 2.2 2.2.8 -2.2.8 -.8 2.2 -.8-2.2 -2.2-.8 2.2-.8z" fill="#d9c8ff"/>
  </g>
  <rect x="5" y="5" width="90" height="90" rx="23" fill="none" stroke="url(#edge)" stroke-width="2.6" filter="url(#soft)"/>
</svg>
