name: Polaric places
# Sums the app's install/update notes into assets/places.json (cities and countries), so the map
# reads one file instead of the slow counter service.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: places
jobs:
  sum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: City names (GeoNames)
        run: curl -sSfL -o cities.zip https://download.geonames.org/export/dump/cities15000.zip && unzip -oq cities.zip
      - run: node scripts/places.mjs
      - name: Commit when changed
        run: |
          git diff --quiet assets/places.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/places.json
          git commit -m "Polaric places: sum the latest notes"
          git pull --rebase -q
          git push
